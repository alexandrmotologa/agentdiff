name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and build web
        run: |
          cd web
          npm ci || npm install
          npm run build

      - name: Run Go tests
        run: go test -v -race ./...

      - name: Build agentdiff binary
        run: go build -v ./cmd/agentdiff
